; PlatformIO project configuration for ESP32-WROOM-32 + BMP280
; Board: ESP32 Dev Module (ESP32-D0WD-V3, 4MB flash)
; Framework: Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Third-party libraries. The WiFi and WebServer libraries are part of the
; ESP32 Arduino core and do not need to be listed here.
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
